version: "2"

run:
  timeout: 5m
  tests: false

linters:

  enable:
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - gosec
    - unconvert
    # - gocyclo
    # - goconst
    # - gocritic
    - govet
    # - revive
formatters:
  enable:
    - goimports
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  new: false
  fix: false
  uniq-by-line: true
  whole-files: false

output:
  show-stats: true
